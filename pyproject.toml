[project]
name = "socratic-ai"
version = "2.1.0"
description = "Turn videos, PDFs, and lectures into a Socratic thinking workout — a structured learning generator with an in-app local/API model switch."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "nicegui",
    "httpx",
    "openai",
    "python-dotenv",
    "sqlalchemy",
    "chromadb",
    "pymupdf",
    "ffmpeg-python",
    "python-multipart",
    "yt-dlp",
    "platformdirs",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
socratic-ai = "run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "routes", "frontend", "prompts"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"config.py" = "config.py"
"run.py" = "run.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p nicegui.testing.user_plugin"
markers = [
    "e2e: end-to-end pipeline tests (slow; require cassettes or OPENAI_API_KEY).",
]

