name: Feature request
description: Something the app should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not the solution. What material, what goal, where the app gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
