name: CI & Release

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest tests/ -m "not e2e" --tb=short
        env:
          OPENAI_API_KEY: sk-test-ci-placeholder
      - name: End-to-end (cassette replay)
        run: uv run pytest tests/ -m e2e --tb=short
        env:
          OPENAI_API_KEY: sk-test-ci-placeholder

  build-macos:
    # The .app only ships from tags; the test job gates it.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - name: Build, sign (ad-hoc), smoke-test and zip
        run: packaging/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/SocraticAI-*-macos-arm64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/SocraticAI-*-macos-arm64.zip
          generate_release_notes: true
