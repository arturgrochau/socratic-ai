name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build launcher binary (Mac/Linux)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile \
            --name "SocraticAI" \
            --add-data "requirements.txt:." \
            --add-data "frontend:frontend" \
            --add-data "app:app" \
            --add-data "prompts:prompts" \
            --add-data "routes:routes" \
            --add-data "main.py:." \
            --add-data "config.py:." \
            launcher.py

      - name: Build launcher binary (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile `
            --name "SocraticAI" `
            --add-data "requirements.txt;." `
            --add-data "frontend;frontend" `
            --add-data "app;app" `
            --add-data "prompts;prompts" `
            --add-data "routes;routes" `
            --add-data "main.py;." `
            --add-data "config.py;." `
            launcher.py
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: socratic-ai-${{ matrix.name }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: socratic-ai-mac
          path: artifacts/mac/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: socratic-ai-windows
          path: artifacts/windows/

      - name: Make Mac binary executable
        run: chmod +x artifacts/mac/SocraticAI

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/mac/SocraticAI
            artifacts/windows/SocraticAI.exe
